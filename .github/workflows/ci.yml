name: EAZYKREDIT validation

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.eazykredit.in
          NEXT_PUBLIC_DEPLOYMENT_STAGE: ci

      - name: Check that local secret files are not tracked
        run: |
          test ! -f .env
          test ! -f .env.local

      - name: Check that secrets are not committed
        shell: bash
        run: |
          if git grep -nE 'MS_CLIENT_SECRET=|SMTP_PASSWORD=|RESEND_API_KEY=' -- \
            ':!*.md' \
            ':!*.example' \
            ':!.github/workflows/ci.yml'; then
            echo "Potential secret found in tracked source files."
            exit 1
          fi

          echo "No obvious committed secrets found."


