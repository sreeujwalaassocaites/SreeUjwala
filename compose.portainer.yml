services:
  api:
    container_name: eazykredit-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_PORT: "8080"
      STORE_LEADS: "${STORE_LEADS:-true}"
      LEAD_RETENTION_DAYS: "${LEAD_RETENTION_DAYS:-30}"
      RATE_LIMIT_COUNT: "${RATE_LIMIT_COUNT:-5}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS:-600}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-eazykredit.franky.co.in,www.eazykredit.in,eazykredit.in}"
      ALLOW_NO_ORIGIN: "${ALLOW_NO_ORIGIN:-false}"
      PUBLIC_PHONE: "${PUBLIC_PHONE:-+919885011157}"
      PUBLIC_WHATSAPP: "${PUBLIC_WHATSAPP:-+919885011157}"
      TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:-}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_SSL: "${SMTP_SSL:-false}"
      SMTP_STARTTLS: "${SMTP_STARTTLS:-true}"
      LEAD_EMAIL_TO: "${LEAD_EMAIL_TO:-}"
      SEND_APPLICANT_ACK: "${SEND_APPLICANT_ACK:-true}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      TWILIO_WHATSAPP_FROM: "${TWILIO_WHATSAPP_FROM:-}"
      LEAD_WHATSAPP_TO: "${LEAD_WHATSAPP_TO:-}"
      TWILIO_CONTENT_SID: "${TWILIO_CONTENT_SID:-}"
      AUTOMATION_WEBHOOK_URL: "${AUTOMATION_WEBHOOK_URL:-}"
      AUTOMATION_WEBHOOK_TOKEN: "${AUTOMATION_WEBHOOK_TOKEN:-}"
    volumes:
      - eazykredit_leads:/data
    networks:
      - eazykredit
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    mem_limit: 256m
    cpus: 0.50

  web:
    container_name: eazykredit-web
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-https://eazykredit.franky.co.in}"
        NEXT_PUBLIC_DEPLOYMENT_STAGE: "${NEXT_PUBLIC_DEPLOYMENT_STAGE:-test}"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      X_ROBOTS_TAG: "${X_ROBOTS_TAG:-noindex, nofollow}"
    ports:
      - "127.0.0.1:${EAZYKREDIT_PORT:-8090}:8080"
    networks:
      - eazykredit
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50

networks:
  eazykredit:
    name: eazykredit

volumes:
  eazykredit_leads:
    name: eazykredit_leads
